name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '01-tang-poetry-analysis/requirements.txt'

      - name: Install Python dependencies & Run Tests
        working-directory: 01-tang-poetry-analysis
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '01-tang-poetry-analysis/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: 01-tang-poetry-analysis
        run: pnpm install --frozen-lockfile

      - name: Build with Vite
        working-directory: 01-tang-poetry-analysis
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './01-tang-poetry-analysis/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
